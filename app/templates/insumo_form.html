{% extends "base.html" %}
{% block titulo %}Novo insumo{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">Cadastrar insumo doado</h1>
<form method="post" class="row g-3">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="col-md-8">
    <label for="nome" class="form-label">Nome do produto</label>
    <input id="nome" name="nome" class="form-control" maxlength="120" required>
  </div>
  <div class="col-md-4">
    <label for="categoria" class="form-label">Categoria</label>
    <select id="categoria" name="categoria" class="form-select" required>
      {% for c in categorias %}<option value="{{ c }}">{{ 'Ração' if c == 'racao' else 'Medicamento' }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label for="lote" class="form-label">Lote</label>
    <input id="lote" name="lote" class="form-control" maxlength="50" required>
  </div>
  <div class="col-md-4">
    <label for="quantidade" class="form-label">Quantidade</label>
    <input id="quantidade" name="quantidade" type="number" min="1" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label for="unidade" class="form-label">Unidade</label>
    <input id="unidade" name="unidade" class="form-control" maxlength="10" value="un">
  </div>
  <div class="col-md-6">
    <label for="validade" class="form-label">Validade</label>
    <input id="validade" name="validade" type="date" class="form-control" required>
  </div>
  <div class="col-md-6">
    <label for="doador" class="form-label">Doador (opcional)</label>
    <input id="doador" name="doador" class="form-control" maxlength="120">
  </div>
  <div class="col-12"><button class="btn btn-primary">Cadastrar e gerar comprovante</button></div>
</form>
{% endblock %}
